<div class="min-vh-100 d-flex flex-column">
  <app-header></app-header>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <header class="text-center mb-5">
              <h1 class="text-primary fw-bold mb-3">Calculadora de Nómina Docente</h1>
              <p class="text-muted lead">
                Calcula tu salario neto introduciendo los conceptos básicos de tu nómina.
              </p>
            </header>
            
            <app-payroll-form (calculate)="onCalculate($event)"></app-payroll-form>

            <app-payroll-result [result]="payrollResult()"></app-payroll-result>

            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
