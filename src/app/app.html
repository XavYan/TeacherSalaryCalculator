<div class="min-vh-100 d-flex flex-column">
  <app-header></app-header>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <header class="text-center mb-5">
              <h1 class="text-primary fw-bold mb-2">Calculadora de Nómina Docente</h1>
              <div class="mb-3">
                <span
                  class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2 animate__animated animate__pulse animate__infinite">
                  <i class="bi bi-calendar-check me-1"></i> Actualizado a 2026
                </span>
              </div>
            </header>

            <app-payroll-form (calculate)="onCalculate($event)"></app-payroll-form>

            <div *ngIf="calculationError()" class="alert alert-danger mt-3" role="alert">{{ calculationError() }}</div>
            <app-payroll-result [result]="payrollResult()"></app-payroll-result>

            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
